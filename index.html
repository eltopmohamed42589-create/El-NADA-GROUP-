<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الندي جروب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold: #d4af37;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); text-align: center; padding-bottom: 50px; transition: 0.3s; }
        header { padding: 30px 20px; border-bottom: 2px solid var(--gold); margin-bottom: 20px; position: relative; }
        .lang-btn { position: absolute; top: 15px; left: 15px; background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        header h1 { color: var(--gold); font-size: 32px; margin-bottom: 10px; }
        header p { color: var(--text-muted); font-size: 16px; }
        .main-btn { display: inline-block; background-color: var(--gold); color: #000; padding: 12px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 18px; margin-top: 15px; border: none; cursor: pointer; }
        .search-container { padding: 0 20px; max-width: 600px; margin: 0 auto 20px auto; }
        .search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px; solid var(--gold); background-color: var(--card-bg); color: white; font-size: 16px; outline: none text-align: center; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .product-card { background-color: var(--card-bg); border: 1px solid var(--gold); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .product-card img { width: 100%; height: 350px; object-fit: cover; border-bottom: 1px solid var(--gold); background-color: #333; }
        .product-info { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .product-name { font-size: 20px; font-weight: bold; }
        .product-code { color: var(--text-muted); font-size: 14px; }
        .ask-btn { background-color: var(--gold); color: #000; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 16px; border: none; cursor: pointer; width: 100%; transition: 0.3s; }
        .ask-btn:hover { background-color: #b5952f; }
        .loading { color: var(--gold); font-size: 20px; margin-top: 50px; }
        #no-results { color: var(--gold); display: none; margin-top: 20px; font-size: 18px; }
        #error-box { display: none; background: darkred; color: white; padding: 15px; margin: 20px; border-radius: 8px; text-align: left; direction: ltr; font-family: monospace; }
    </style>
</head>
<body>

    <header>
        <button class="lang-btn" onclick="toggleLanguage()">English / عربي</button>
        <h1 id="main-title">الندي جروب</h1>
        <p id="sub-title">لتجارة وتسويق الملابس</p>
        <a href="https://wa.me/201097312949" class="main-btn" id="wa-btn" target="_blank">اطلب على واتساب</a>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج..." onkeyup="filterProducts()">
    </div>

    <div id="error-box"></div>

    <div id="products-container" class="products-grid">
        <div class="loading" id="loading-text">جاري تحميل المنتجات...</div>
    </div>
    <div id="no-results">لا توجد منتجات مطابقة للبحث.</div>

    <script>
        // البيانات جاهزة هنا
        const SUPABASE_URL = "https://cfoqfiegzrftxqnxqsd.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_ILHm9vdsjZ87M7sDIKqHMA_swlu62mF";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let allProducts = [];
        let isArabic = true;

        const translations = {
            ar: { title: "الندي جروب", sub: "لتجارة وتسويق الملابس", wa: "اطلب على واتساب", search: "ابحث عن منتج...", code: "كود", ask: "اسأل عن السعر", noRes: "لا توجد منتجات مطابقة." },
            en: { title: "EL-NADA GROUP", sub: "Clothing Trade & Marketing", wa: "Order on WhatsApp", search: "Search for a product...", code: "Code", ask: "Ask for price", noRes: "No matching products found." }
        };

        function toggleLanguage() {
            isArabic = !isArabic;
            const lang = isArabic ? 'ar' : 'en';
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;

            document.getElementById('main-title').innerText = translations[lang].title;
            document.getElementById('sub-title').innerText = translations[lang].sub;
            document.getElementById('wa-btn').innerText = translations[lang].wa;
            document.getElementById('searchInput').placeholder = translations[lang].search;
            document.getElementById('no-results').innerText = translations[lang].noRes;

            renderProducts(allProducts);
        }

        async function loadProducts() {
            const container = document.getElementById('products-container');
            const loadingText = document.getElementById('loading-text');
            const errorBox = document.getElementById('error-box');

            try {
                const { data: products, error } = await supabaseClient.from('products').select('*');

                if (error) {
                    loadingText.style.display = 'none';
                    errorBox.style.display = 'block';
                    errorBox.innerHTML = `<strong>Error Message:</strong> ${error.message}<br><br><strong>Details:</strong> ${error.details}<br><br><strong>Hint:</strong> ${error.hint}<br><br><strong>Code:</strong> ${error.code}`;
                    return;
                }

                loadingText.style.display = 'none';
                allProducts = products || [];
                renderProducts(allProducts);
            } catch (err) {
                loadingText.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.innerHTML = `<strong>Network Error:</strong> ${err.message}`;
            }
        }

        function renderProducts(productsToRender) {
            const container = document.getElementById('products-container');
            const noResults = document.getElementById('no-results');
            container.innerHTML = '';

            if (productsToRender.length === 0) {
                noResults.style.display = 'block';
                return;
            } else {
                noResults.style.display = 'none';
            }

            const lang = isArabic ? 'ar' : 'en';

            productsToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const whatsappMessage = encodeURIComponent(`مرحباً، عايز أستفسر عن المنتج: ${product.name} (كود: ${product.code})`);
                const whatsappLink = `https://wa.me/201097312949?text=${whatsappMessage}`;

                card.innerHTML = `
                    <img src="${product.image_url}" alt="${product.name}">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-code">${translations[lang].code}: ${product.code}</div>
                        <a href="${whatsappLink}" target="_blank" class="ask-btn">${translations[lang].ask}</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.code && p.code.toString().includes(query))
            );
            renderProducts(filtered);
        }

        loadProducts();
    </script>
</body>
</html>
